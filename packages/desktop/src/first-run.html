<!doctype html>
<meta charset="utf-8">
<title>pdf2audio</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --dim:#666; --line:#e3e3e3; --ok:#1a7f37; --stop:#b3261e; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --dim:#999; --line:#333; --bg:#1c1c1e; } }
  body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; color:var(--fg); background:var(--bg);
         display:grid; place-items:center; height:100vh; }
  main { width:420px; }
  h1 { font-size:17px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--dim); }
  li { display:flex; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); list-style:none; }
  ul { margin:0; padding:0; }
  .mark { width:16px; text-align:center; color:var(--dim); }
  .done .mark { color:var(--ok); } .blocked .mark { color:var(--stop); }
  .label { flex:1; } .detail { color:var(--dim); font-size:12.5px; }
  .blocked .detail { color:var(--stop); }
  button { margin-top:20px; font:inherit; padding:7px 14px; border-radius:7px; border:1px solid var(--line);
           background:transparent; color:inherit; cursor:pointer; display:none; }
  body.stuck button { display:inline-block; }
  #pick { display:none; }
</style>
<main>
  <h1>Starting pdf2audio</h1>
  <p class="sub">First run sets things up. Later ones skip straight past.</p>
  <ul id="steps"></ul>
  <button onclick="window.setup.recheck()">Check again</button>
  <button id="pick" onclick="window.setup.chooseHome()" style="margin-left:8px">Choose folder…</button>
</main>
<script>
  const STEPS = [["home","Setup folder"],["docker","Docker"],["database","Database"],["server","Starting pdf2audio"]];
  const marks = { pending:"○", running:"◍", done:"✓", blocked:"!" };
  const ul = document.getElementById("steps");
  for (const [id, label] of STEPS) {
    ul.insertAdjacentHTML("beforeend",
      `<li id="s-${id}"><span class="mark">○</span><span class="label">${label}</span><span class="detail"></span></li>`);
  }
  window.setup.onStep(({ id, state, detail }) => {
    const li = document.getElementById("s-" + id);
    if (!li) return;
    li.className = state;
    li.querySelector(".mark").textContent = marks[state] ?? "○";
    if (detail) li.querySelector(".detail").textContent = detail;
    // Only offer "Check again" for something the person can actually go and fix
    document.body.classList.toggle("stuck", !!document.querySelector("li.blocked"));
    // Only the folder question has a folder answer
    document.getElementById("pick").style.display =
      document.getElementById("s-home").className === "blocked" ? "inline-block" : "none";
  });
</script>
