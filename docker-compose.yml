services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pdf2audio
      POSTGRES_PASSWORD: pdf2audio
      POSTGRES_DB: pdf2audio
    volumes:
      # pgdata17 (glibc) replaced the alpine-era pgdata volume on 2026-08-08; old volume kept as rollback
      - pgdata17:/var/lib/postgresql/data

volumes:
  pgdata17:
