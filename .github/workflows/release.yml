# Builds and publishes the macOS app on a version tag. Not enabled until there is an Apple
# Developer account: without a certificate the DMG still builds, but every download opens to
# "cannot be opened because the developer cannot be verified", which is the wall this exists to
# remove. Until then, `workflow_dispatch` runs everything except the signing step.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    # arm64. MLX is Metal, so an Intel runner cannot even smoke-test what it builds.
    runs-on: macos-15
    # `secrets` is not a context a step-level `if` can read; a job-level env is.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not the server suite: it needs a live Postgres on 5433, and GitHub's macOS runners have no
      # Docker and cannot run service containers. Those tests run locally and would need a Linux
      # job of their own — releasing on a green macOS build is not a claim that they passed.
      - run: pnpm --filter @pdf2audio/web --filter @pdf2audio/desktop test

      # scripts/bundle-tools.py copies these out of Homebrew, and make-icon renders the .icns
      - run: brew install ffmpeg poppler librsvg imagemagick

      # The same script used locally. Building the pieces separately here is how CI ends up
      # shipping an Electron shell with no server in it and nobody noticing until a user downloads.
      - run: scripts/desktop-build.sh --fast
        if: env.HAS_CERT == 'no'

      - name: Package, sign and notarise
        if: env.HAS_CERT == 'yes'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/desktop-build.sh --no-package
          pnpm --filter @pdf2audio/desktop exec electron-builder --mac --publish always

      - name: Warn when unsigned
        if: env.HAS_CERT == 'no'
        run: echo "::warning::No Apple certificate configured — built but not published. See tasks/desktop-app.md."
